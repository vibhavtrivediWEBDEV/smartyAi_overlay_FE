name: Deploy frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the deployment commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installation, safety tests, and builds run only on EC2.
      - name: Transfer source and run EC2 deployment script
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST}"
          : "${EC2_USER:?Missing EC2_USER}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}"
          : "${EC2_KNOWN_HOSTS:?Missing EC2_KNOWN_HOSTS}"
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset EC2_SSH_KEY EC2_KNOWN_HOSTS
          ssh_options=(
            -i "$ssh_dir/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          target="$EC2_USER@$EC2_HOST"
          git bundle create "$ssh_dir/source.bundle" HEAD
          upload_dir=$(ssh "${ssh_options[@]}" "$target" 'mktemp -d /tmp/smarty-frontend.XXXXXXXX')
          [[ "$upload_dir" =~ ^/tmp/smarty-frontend\.[a-zA-Z0-9]+$ ]]
          scp "${ssh_options[@]}" "$ssh_dir/source.bundle" "$target:$upload_dir/source.bundle"
          # Bash runs on EC2; SSH streams logs and propagates the deployment exit code.
          ssh "${ssh_options[@]}" "$target" "bash -s -- '$upload_dir' '$GITHUB_SHA'" < .github/scripts/deploy-frontend.sh

      - name: Verify public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for url in https://bhavishya.site/ https://bhavishya.site/login https://www.bhavishya.site/; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 \
              --connect-timeout 10 --max-time 20 --output /dev/null \
              --write-out "$url HTTP %{http_code}\n" "$url"
          done
